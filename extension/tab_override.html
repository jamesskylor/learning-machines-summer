<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OffSeason OS</title>
  <link rel="icon" type="image/png" href="assets/48.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #0b0b10;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #e8e6df;
    }
    iframe {
      border: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* Fallback message shown only if the iframe never loads */
    .fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 2rem;
      z-index: -1;
    }
    .fallback h1 {
      font-weight: 500;
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .fallback p {
      opacity: 0.7;
      max-width: 32rem;
    }
    .fallback a {
      color: #e8e6df;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <iframe
    src="https://offseason.school/os"
    title="OffSeason OS"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <div class="fallback" id="fallback">
    <h1>Couldn't reach OffSeason OS.</h1>
    <p>
      Check your connection, or visit
      <a href="https://offseason.school/os">offseason.school/os</a>
      directly.
    </p>
  </div>
</body>
</html>
